openapi: 3.0.3
info:
  title: ghosty-bff
  version: 0.1.0
  description: |
    Backend for Frontend do Ghosty: o único backend que o front chama, sempre pelo API Management.

    **Autenticação**
    - `Authorization: Bearer <jwt>`: JWT de acesso (RS256, 15 minutos, `aud` = `notes-web`), emitido em
      `/auth/login` e `/auth/register` e renovado em `/auth/refresh`.
    - `X-Safety-Token`: token da sessão segura (10 minutos, `scope=safety`), emitido em `POST /safety/session`.
      Exigido em `/aggregated-data` e em toda rota `/safety/...`. Fica só em memória no navegador.
    - Pelo API Management, o front também envia `Ocp-Apim-Subscription-Key` (chave pública do produto
      `web-app`). Na máquina local o front chama o BFF direto, sem essa chave.

    **Como o cliente deve tratar os erros**
    - `401` sempre quer dizer "sessão inválida": o cliente renova o JWT uma vez com o refresh token e
      repete a chamada. Se a renovação falhar, volta para a tela de entrar.
    - `403` nas rotas `/safety/...` e em `/aggregated-data` quer dizer que a sessão segura acabou: o
      cliente faz a saída rápida.
    - `POST /safety/session` com código errado ou conta bloqueada responde `403`, sempre igual, para não
      revelar o estado. Não é `401` para o cliente não repetir a chamada (o que contaria duas tentativas).
    - Senha atual errada em `PUT /account/lock-code` responde `400` com o erro no campo `currentPassword`.
    - `429` traz `Retry-After`. `503` indica um serviço interno fora do ar (exceto em `/aggregated-data`,
      que responde parcial).

    **Convenções:** JSON em camelCase; datas ISO 8601 em UTC; IDs em UUID v7 (as notas usam o ObjectId do
    MongoDB); erros em `application/problem+json` (RFC 9457) com `code`; `X-Correlation-Id` em todas as
    respostas.
servers:
  - url: http://localhost:3000
    description: Máquina local
  - url: http://localhost:4010
    description: Mock (Prism)
tags:
  - name: auth
    description: Cadastro, login e sessão
  - name: oidc
    description: Metadados para o validate-jwt do API Management
  - name: account
    description: Conta e código de bloqueio do app
  - name: notes
    description: Notas da fachada
  - name: safety-session
    description: Desbloqueio da área de segurança
  - name: dashboard
    description: Painel agregado
  - name: contacts
    description: Rede de apoio
  - name: alert-settings
    description: Mensagem de aviso
  - name: check-ins
    description: Check-in "cheguei bem"
  - name: help-requests
    description: Pedidos de ajuda e Teste seguro
  - name: invitations
    description: Página pública do convite
  - name: health
    description: Situação do serviço
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Situação do serviço
      security: []
      responses:
        '200':
          description: Serviço no ar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ok:
                  value:
                    status: ok
                    service: ghosty-bff
                    time: '2026-11-06T22:10:00Z'

  # ---------------------------------------------------------------- Autenticação
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Cria a conta e já entra
      description: Cria a conta no `safety-service`, cria 3 notas de exemplo para a fachada parecer usada e devolve a sessão.
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              maria:
                value:
                  displayName: Maria
                  email: maria.exemplo@example.com
                  password: uma-senha-longa-de-exemplo
      responses:
        '201':
          description: Conta criada e sessão aberta
          headers:
            Location:
              description: A conta criada
              schema:
                type: string
              example: /account
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                session:
                  $ref: '#/components/examples/AuthSessionNew'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/EmailInUse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Entra com e-mail e senha
      description: Limite de 5 tentativas por minuto por IP. E-mail inexistente e senha errada recebem a mesma resposta.
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              maria:
                value:
                  email: maria.exemplo@example.com
                  password: uma-senha-longa-de-exemplo
      responses:
        '200':
          description: Sessão aberta
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                session:
                  $ref: '#/components/examples/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Renova a sessão
      description: Troca o refresh token por um novo (rotação) e devolve um JWT novo. O refresh token usado deixa de valer.
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              refresh:
                value:
                  refreshToken: FtFqsasltdyRGJ0yixDYbKQYOu0lShYtzV_IMr6M3ik
      responses:
        '200':
          description: Sessão renovada
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                session:
                  $ref: '#/components/examples/AuthSessionRefreshed'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sai da conta
      description: Revoga o refresh token. É idempotente.
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              logout:
                value:
                  refreshToken: F4kRweJ1MAVVYiqsrKCSvpHc_MgytYRyOmwfwQHSNoo
      responses:
        '204':
          description: Sessão encerrada
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /.well-known/openid-configuration:
    get:
      tags: [oidc]
      operationId: getOpenIdConfiguration
      summary: Metadados do emissor do JWT
      description: Lido pelo `validate-jwt` do API Management. Os nomes dos campos seguem o padrão OpenID (snake_case).
      security: []
      responses:
        '200':
          description: Metadados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIdConfiguration'
              examples:
                local:
                  value:
                    issuer: http://localhost:3000
                    jwks_uri: http://localhost:3000/.well-known/jwks.json
                    id_token_signing_alg_values_supported: [RS256]
                    response_types_supported: [token]
                    subject_types_supported: [public]
  /.well-known/jwks.json:
    get:
      tags: [oidc]
      operationId: getJwks
      summary: Chaves públicas do JWT
      security: []
      responses:
        '200':
          description: JWKS com a chave atual (o `kid` vem do cabeçalho do JWT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
              examples:
                keys:
                  value:
                    keys:
                      - kty: RSA
                        use: sig
                        alg: RS256
                        kid: 2026-11
                        n: 0q8DHzTmB-4-p_egXONUGDFth7ivaQHZTCYCdDMCCJRkuzEilYLpq9MebwUYRI-n099qWJzXfphewAuoUSOkq25UO9wxIqdQX3ujbEcMniG-D9hUPqLjWk-_ZeQwJleaA2LlU_PmC1dWiwEnzMaYwr-2rQCnCNnmYCyCJf-qqdX8-5ybBlnHwSLsKOQvOX5oZwQjvXmGOd3vThj8_xLhc2b2H7UlPLRdU9L7rOc3cHutbqgUv8TVuUhsPR5pA6BNcF6uQWitIdjGRKj8DScIaEf7smuHO3HPf3k9eqo4i4harpOsUX4aLAm-_IJQviWDiBB_sG2k8Y9g9MZM7ciCow
                        e: AQAB

  # ---------------------------------------------------------------- Conta
  /account:
    get:
      tags: [account]
      operationId: getAccount
      summary: Dados da conta
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: A conta
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                maria:
                  $ref: '#/components/examples/Account'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [account]
      operationId: updateAccount
      summary: Altera o nome
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
            examples:
              rename:
                value:
                  displayName: Maria Silva
      responses:
        '200':
          description: Conta atualizada
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                renamed:
                  value:
                    id: 01a15965-b480-79af-a113-29b2fc82e5ef
                    email: maria.exemplo@example.com
                    displayName: Maria Silva
                    secretCodeSet: true
                    createdAt: '2026-10-20T13:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [account]
      operationId: deleteAccount
      summary: Exclui a conta
      description: Apaga as notas no `notes-service` e a conta (em cascata) no `safety-service`. Também revoga as sessões.
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '204':
          description: Conta excluída
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /account/lock-code:
    put:
      tags: [account]
      operationId: setLockCode
      summary: Define o código de bloqueio do app
      description: |
        Para quem olha, é o PIN do app de notas. Por dentro, é o código secreto que abre a área de segurança.
        Exige a senha atual: se ela estiver errada, responde 400 com o erro em `currentPassword`.
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLockCodeRequest'
            examples:
              set:
                value:
                  currentPassword: uma-senha-longa-de-exemplo
                  code: '482915'
      responses:
        '204':
          description: Código definido
        '400':
          $ref: '#/components/responses/LockCodeInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Notas
  /notes:
    get:
      tags: [notes]
      operationId: listNotes
      summary: Lista as notas
      description: Fixadas primeiro, depois `updatedAt` decrescente.
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - name: archived
          in: query
          schema:
            type: boolean
            default: false
          example: false
        - name: label
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 30
          example: casa
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
          example: mercado
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Uma página de notas
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotePage'
              examples:
                page:
                  $ref: '#/components/examples/NotePage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [notes]
      operationId: createNote
      summary: Cria uma nota
      description: Precisa de título ou conteúdo. Nota `text` usa `body`; nota `checklist` usa `items`.
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
            examples:
              checklist:
                value:
                  kind: checklist
                  title: Lista do mercado
                  items:
                    - text: pão
                    - text: leite
                  color: yellow
                  labels: [casa]
                  pinned: true
              text:
                value:
                  kind: text
                  title: Dentista quinta 14h
                  body: Levar a carteirinha do convênio.
                  reminderAt: '2026-11-12T17:00:00Z'
      responses:
        '201':
          description: Nota criada
          headers:
            Location:
              description: A nota criada
              schema:
                type: string
              example: /notes/6aec6fc05bd053a2e3d78b78
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
              examples:
                checklist:
                  $ref: '#/components/examples/ChecklistNote'
                text:
                  $ref: '#/components/examples/TextNote'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/NoteId'
      - $ref: '#/components/parameters/XCorrelationId'
    get:
      tags: [notes]
      operationId: getNote
      summary: Busca uma nota
      responses:
        '200':
          description: A nota
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
              examples:
                checklist:
                  $ref: '#/components/examples/ChecklistNote'
                text:
                  $ref: '#/components/examples/TextNote'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [notes]
      operationId: updateNote
      summary: Salva a nota inteira
      description: Exige a `version` lida. Versão antiga responde 409 `VERSION_CONFLICT`, e o front recarrega a nota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteRequest'
            examples:
              save:
                value:
                  version: 1
                  kind: checklist
                  title: Lista do mercado
                  items:
                    - id: 01a1ab94-8600-70de-85cf-24f12763c4f4
                      text: pão
                      done: true
                    - id: 01a1ab94-89e8-7df8-90e4-100f3bb07132
                      text: leite
                      done: false
                  color: yellow
                  labels: [casa]
                  pinned: true
                  archived: false
                  reminderAt: null
      responses:
        '200':
          description: Nota salva
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
              examples:
                saved:
                  $ref: '#/components/examples/ChecklistNoteSaved'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [notes]
      operationId: patchNote
      summary: Altera campos da nota
      description: |
        Fixar, arquivar, cor, etiquetas, lembrete, título, marcar um item ou converter o tipo
        (`kind`, preservando o texto). A `version` é opcional; se vier, é conferida.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchNoteRequest'
            examples:
              checkItem:
                value:
                  item:
                    id: 01a1ab94-8600-70de-85cf-24f12763c4f4
                    done: true
              archive:
                value:
                  archived: true
      responses:
        '200':
          description: Nota alterada
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
              examples:
                saved:
                  $ref: '#/components/examples/ChecklistNoteSaved'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [notes]
      operationId: deleteNote
      summary: Apaga a nota
      responses:
        '204':
          description: Nota apagada
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Sessão segura
  /safety/session:
    post:
      tags: [safety-session]
      operationId: unlockSafety
      summary: Abre a área de segurança com o código
      description: |
        O shell chama esta rota quando a busca recebe só dígitos (6 a 8) e a pessoa aperta Enter.
        Código certo: devolve o token da sessão segura e a URL do remote `safety`.
        Código errado ou conta bloqueada: **403, sempre igual**; o shell não mostra nada além de
        "Nenhuma nota encontrada". O cliente não deve repetir esta chamada automaticamente.
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockSafetyRequest'
            examples:
              code:
                value:
                  code: '482915'
      responses:
        '200':
          description: Sessão segura aberta
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetySession'
              examples:
                unlocked:
                  value:
                    safetyToken: eyJhbGciOiJSUzI1NiIsImtpZCI6IjIwMjYtMTEiLCJ0eXAiOiJKV1QifQ.eyJpc3MiOiJodHRwOi8vbG9jYWxob3N0OjMwMDAiLCJhdWQiOiJub3Rlcy13ZWIiLCJzdWIiOiIwMWExNTk2NS1iNDgwLTc5YWYtYTExMy0yOWIyZmM4MmU1ZWYiLCJzY29wZSI6InNhZmV0eSIsImp0aSI6IjAxYTFiMmU5LTYyOTAtN2YwMC04YTExLTBiMWMyZDNlNGY1MCIsImlhdCI6MTc5NDAwMzAwMCwiZXhwIjoxNzk0MDAzNjAwfQ.YXNzaW5hdHVyYS1kZS1leGVtcGxvLW5hby12YWxpZGE
                    expiresIn: 600
                    remoteUrl: http://localhost:5175/remoteEntry.js
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/UnlockRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [safety-session]
      operationId: lockSafety
      summary: Fecha a área de segurança (saída rápida)
      description: Revoga o token da sessão segura enviado em `X-Safety-Token`. Responde 204 mesmo se o token já tiver vencido.
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - name: X-Safety-Token
          in: header
          required: false
          description: Token a revogar
          schema:
            type: string
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6IjIwMjYtMTEiLCJ0eXAiOiJKV1QifQ.e30.YXNzaW5hdHVyYQ
      responses:
        '204':
