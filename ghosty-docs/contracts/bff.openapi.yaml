                    destination: Casa
                    dueAt: '2026-11-07T02:30:00Z'
                    toleranceMinutes: 10
                    deadlineAt: '2026-11-07T02:40:00Z'
                    status: confirmed
                    mode: real
                    version: 1
                    createdAt: '2026-11-06T22:00:00Z'
                    confirmedAt: '2026-11-07T02:12:00Z'
                    expiredAt: null
                    helpRequestId: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SafetySessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CheckInNotActive'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Pedidos de ajuda
  /safety/help-requests:
    get:
      tags: [help-requests]
      operationId: listHelpRequests
      summary: Lista os pedidos de ajuda
      security:
        - bearerAuth: []
          safetyToken: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/ModeFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Uma página de pedidos, do mais novo para o mais antigo
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequestPage'
              examples:
                page:
                  value:
                    items:
                      - id: 01a1b2e9-6678-7ead-96cd-77eeda864fb3
                        origin: button
                        mode: real
                        status: dispatched
                        createdAt: '2026-11-06T22:10:03Z'
                        dispatchedAt: '2026-11-06T22:10:06Z'
                    page: 1
                    pageSize: 20
                    total: 1
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SafetySessionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [help-requests]
      operationId: triggerHelpRequest
      summary: Pede ajuda (ou faz o Teste seguro)
      description: |
        Responde 202 na hora: o envio acontece depois. O front consulta o `Location` a cada 2 segundos
        até `status` sair de `triggered`, e depois de 60 segundos mostra "ainda processando".
        `mode: test` nunca envia nada. A mesma `Idempotency-Key` devolve o mesmo pedido.
      security:
        - bearerAuth: []
          safetyToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerHelpRequestRequest'
            examples:
              real:
                value:
                  mode: real
                  location:
                    lat: -23.5505
                    lng: -46.6333
                    accuracyMeters: 20
              safeTest:
                value:
                  mode: test
      responses:
        '202':
          description: Pedido aceito
          headers:
            Location:
              description: O pedido, para acompanhar o envio
              schema:
                type: string
              example: /safety/help-requests/01a1b2e9-6678-7ead-96cd-77eeda864fb3
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequest'
              examples:
                triggered:
                  $ref: '#/components/examples/HelpRequestTriggered'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SafetySessionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /safety/help-requests/{helpRequestId}:
    get:
      tags: [help-requests]
      operationId: getHelpRequest
      summary: Busca o pedido, com a linha do tempo
      security:
        - bearerAuth: []
          safetyToken: []
      parameters:
        - $ref: '#/components/parameters/HelpRequestId'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: O pedido e os passos do envio
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequest'
              examples:
                dispatched:
                  $ref: '#/components/examples/HelpRequestDispatched'
                safeTest:
                  $ref: '#/components/examples/HelpRequestSafeTest'
                triggered:
                  $ref: '#/components/examples/HelpRequestTriggered'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SafetySessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /safety/help-requests/{helpRequestId}/cancel:
    post:
      tags: [help-requests]
      operationId: cancelHelpRequest
      summary: Foi engano
      description: Só registra o cancelamento. O aviso já enviado não é desfeito.
      security:
        - bearerAuth: []
          safetyToken: []
      parameters:
        - $ref: '#/components/parameters/HelpRequestId'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Pedido cancelado
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequest'
              examples:
                cancelled:
                  value:
                    id: 01a1b2e9-6678-7ead-96cd-77eeda864fb3
                    origin: button
                    mode: real
                    status: cancelled
                    location:
                      lat: -23.5505
                      lng: -46.6333
                      accuracyMeters: 20
                    checkInId: null
                    createdAt: '2026-11-06T22:10:03Z'
                    dispatchedAt: '2026-11-06T22:10:06Z'
                    steps: []
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SafetySessionRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/HelpRequestNotCancellable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Convite (público)
  /invitations/{token}:
    get:
      tags: [invitations]
      operationId: getInvitation
      summary: Abre a página do convite
      description: |
        Usada pela rota `/c/:token` do shell. Com token válido, devolve também `remoteUrl`, para o shell
        carregar o `safety/Invite`. Token desconhecido: 404 (a página mostra uma tela neutra). Vencido: 410.
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Dados do convite
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
              examples:
                pending:
                  $ref: '#/components/examples/InvitationPagePending'
                acceptedWeb:
                  $ref: '#/components/examples/InvitationPageWeb'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/InvitationExpired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /invitations/{token}/accept:
    post:
      tags: [invitations]
      operationId: acceptInvitation
      summary: Aceita o convite
      description: |
        `web`: o contato vira `confirmed` na hora, e a mesma página passa a mostrar os avisos.
        `telegram`: devolve o link `t.me`; o contato só vira `confirmed` quando tocar em Iniciar no bot.
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
            examples:
              web:
                value:
                  channel: web
              telegram:
                value:
                  channel: telegram
      responses:
        '200':
          description: Convite aceito (web) ou link do Telegram (telegram)
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
              examples:
                web:
                  $ref: '#/components/examples/InvitationPageWeb'
                telegram:
                  $ref: '#/components/examples/InvitationPageTelegramChosen'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvitationAlreadyAnswered'
        '410':
          $ref: '#/components/responses/InvitationExpired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /invitations/{token}/decline:
    post:
      tags: [invitations]
      operationId: declineInvitation
      summary: Recusa o convite
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Convite recusado
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
              examples:
                declined:
                  value:
                    inviterDisplayName: Maria
                    status: declined
                    channel: null
                    expiresAt: '2026-11-09T22:10:00Z'
                    respondable: false
                    telegramUrl: https://t.me/ghosty_dev_bot?start=jKotp-mc9i8mlKGKyexO0wc181jY4RIorNnJu-kXiag
                    remoteUrl: http://localhost:5175/remoteEntry.js
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvitationAlreadyAnswered'
        '410':
          $ref: '#/components/responses/InvitationExpired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /invitations/{token}/alerts:
    get:
      tags: [invitations]
      operationId: getInvitationAlerts
      summary: Avisos recebidos pelo contato do canal web
      description: A página do convite consulta a cada 5 segundos, com `since`. Só para contatos confirmados no canal web.
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
        - $ref: '#/components/parameters/XCorrelationId'
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          example: '2026-11-06T22:00:00Z'
      responses:
        '200':
          description: Avisos publicados para o contato
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAlerts'
              examples:
                oneAlert:
                  value:
                    items:
                      - helpRequestId: 01a1b2e9-6678-7ead-96cd-77eeda864fb3
                        message: 'Oi, Beto. Aqui é Maria. Posso estar em uma situação de risco e preciso de ajuda. Minha localização: https://www.google.com/maps?q=-23.5505,-46.6333 (precisão de 20 m). Enviado às 19:10.'
                        publishedAt: '2026-11-06T22:10:06Z'
                none:
                  value:
                    items: []
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de acesso (RS256, 15 minutos)
    safetyToken:
      type: apiKey
      in: header
      name: X-Safety-Token
      description: Token da sessão segura (10 minutos, `scope=safety`). Só em memória.
  parameters:
    XCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador da operação. O API Management gera um se não vier.
      schema:
        type: string
        maxLength: 100
      example: 01a1b2e9-6290-7765-80a9-717fa4f6dfff
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Gerada pelo front a cada tentativa nova (`crypto.randomUUID()`). Vale por 24 horas.
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: 9b2f6c1e-3d4a-4f5b-8c7d-6e5f4a3b2c1d
    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{24}$'
      example: 6aec6fc05bd053a2e3d78b78
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 01a1596a-4860-7d3c-971c-a474b56c7ce7
    CheckInId:
      name: checkInId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 01a1b2e0-3300-7abf-90bf-07d69a5799b9
    HelpRequestId:
      name: helpRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 01a1b2e9-6678-7ead-96cd-77eeda864fb3
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: jKotp-mc9i8mlKGKyexO0wc181jY4RIorNnJu-kXiag
    ModeFilter:
      name: mode
      in: query
      schema:
        type: string
        enum: [real, test]
      example: real
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  headers:
    XCorrelationId:
      description: O identificador da operação (o recebido ou o gerado)
      schema:
        type: string
      example: 01a1b2e9-6290-7765-80a9-717fa4f6dfff
    RetryAfter:
      description: Segundos até poder tentar de novo
      schema:
        type: integer
        minimum: 1
      example: 42
  schemas:
    Health:
      type: object
      required: [status, service, time]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        time:
          type: string
          format: date-time
    Uuid:
      type: string
      format: uuid
    OpaqueToken:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
    Email:
      type: string
      format: email
      maxLength: 254
    DisplayName:
      type: string
      minLength: 1
      maxLength: 80
    Mode:
      type: string
      enum: [real, test]

    # Autenticação
    RegisterRequest:
      type: object
      required: [displayName, email, password]
      properties:
        displayName:
          $ref: '#/components/schemas/DisplayName'
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          $ref: '#/components/schemas/OpaqueToken'
    AuthSession:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresAt, user]
      properties:
        accessToken:
          type: string
          description: JWT RS256 (`iss` = URL do BFF, `aud` = `notes-web`, `sub` = id da conta)
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Segundos até o JWT vencer
          example: 900
        refreshToken:
          $ref: '#/components/schemas/OpaqueToken'
        refreshExpiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/SessionUser'
    SessionUser:
      type: object
      required: [id, displayName, email]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        displayName:
          $ref: '#/components/schemas/DisplayName'
        email:
          $ref: '#/components/schemas/Email'
    OpenIdConfiguration:
      type: object
      required: [issuer, jwks_uri, id_token_signing_alg_values_supported]
      properties:
        issuer:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, use, alg, kid, n, e]
            properties:
              kty:
                type: string
                enum: [RSA]
              use:
                type: string
                enum: [sig]
              alg:
                type: string
                enum: [RS256]
              kid:
                type: string
              n:
                type: string
              e:
                type: string

    # Conta
    Account:
      type: object
      required: [id, email, displayName, secretCodeSet, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          $ref: '#/components/schemas/Email'
        displayName:
          $ref: '#/components/schemas/DisplayName'
        secretCodeSet:
          type: boolean
          description: Se o código de bloqueio já foi definido
        createdAt:
          type: string
          format: date-time
    UpdateAccountRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          $ref: '#/components/schemas/DisplayName'
    SetLockCodeRequest:
      type: object
      required: [currentPassword, code]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          format: password
        code:
          type: string
          pattern: '^[0-9]{6,8}$'
          description: 6 a 8 dígitos

    # Notas
    NoteKind:
      type: string
      enum: [text, checklist]
    NoteColor:
      type: string
      enum: [default, yellow, green, blue, pink, gray]
    Label:
      type: string
      minLength: 1
      maxLength: 30
    ChecklistItem:
      type: object
      required: [id, text, done]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        text:
          type: string
          minLength: 1
          maxLength: 500
        done:
          type: boolean
    ChecklistItemInput:
      type: object
      required: [text]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        text:
          type: string
          minLength: 1
          maxLength: 500
        done:
          type: boolean
          default: false
    Note:
      type: object
      required: [id, kind, title, color, labels, pinned, archived, reminderAt, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{24}$'
        kind:
          $ref: '#/components/schemas/NoteKind'
        title:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 20000
          description: Só em notas `text`
        items:
          type: array
          maxItems: 200
          description: Só em notas `checklist`
          items:
            $ref: '#/components/schemas/ChecklistItem'
        color:
          $ref: '#/components/schemas/NoteColor'
        labels:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Label'
        pinned:
          type: boolean
        archived:
          type: boolean
        reminderAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    CreateNoteRequest:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/NoteKind'
        title:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 20000
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ChecklistItemInput'
        color:
          allOf:
            - $ref: '#/components/schemas/NoteColor'
          default: default
        labels:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Label'
        pinned:
          type: boolean
          default: false
        reminderAt:
          type: string
          format: date-time
          nullable: true
    UpdateNoteRequest:
      type: object
      required: [version, kind, title, color, labels, pinned, archived, reminderAt]
      properties:
        version:
          type: integer
          minimum: 1
        kind:
          $ref: '#/components/schemas/NoteKind'
        title:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 20000
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ChecklistItemInput'
        color:
          $ref: '#/components/schemas/NoteColor'
        labels:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Label'
        pinned:
          type: boolean
        archived:
          type: boolean
        reminderAt:
          type: string
          format: date-time
          nullable: true
    PatchNoteRequest:
      type: object
      minProperties: 1
      properties:
        version:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 200
        kind:
          allOf:
            - $ref: '#/components/schemas/NoteKind'
          description: Converte o tipo preservando o texto
        pinned:
          type: boolean
        archived:
          type: boolean
        color:
          $ref: '#/components/schemas/NoteColor'
        labels:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Label'
        reminderAt:
          type: string
          format: date-time
          nullable: true
        item:
          type: object
          required: [id, done]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            done:
              type: boolean
    NotePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    # Sessão segura
    UnlockSafetyRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6,8}$'
    SafetySession:
      type: object
      required: [safetyToken, expiresIn, remoteUrl]
      properties:
        safetyToken:
          type: string
          description: JWT `scope=safety`, renovado a cada uso até no máximo 30 minutos
        expiresIn:
          type: integer
          example: 600
        remoteUrl:
          type: string
          format: uri
          description: '`remoteEntry.js` do remote `safety` (`SAFETY_REMOTE_URL`)'

    # Painel
    ContactSummary:
      type: object
      required: [id, nickname, position, status, channel]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nickname:
          type: string
        position:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ContactStatus'
        channel:
          type: string
          enum: [telegram, web, null]
          nullable: true
    FacadeBlock:
      type: object
      nullable: true
      description: '`null` quando o `notes-service` não respondeu'
      required: [totalNotes, pinned, archived, updatedLast14Days, remindersToday]
      properties:
        totalNotes:
          type: integer
          minimum: 0
        pinned:
          type: integer
          minimum: 0
        archived:
          type: integer
          minimum: 0
        updatedLast14Days:
          type: integer
          minimum: 0
        remindersToday:
          type: integer
          minimum: 0
    SafetyBlock:
      type: object
      nullable: true
      description: '`null` quando o `safety-service` não respondeu'
      required: [network, alertSettings, activeCheckIn, lastTest]
      properties:
        network:
          type: object
          required: [total, confirmed, pending, declined, contacts]
          properties:
            total:
              type: integer
              minimum: 0
            confirmed:
              type: integer
              minimum: 0
            pending:
              type: integer
              minimum: 0
            declined:
              type: integer
              minimum: 0
            contacts:
              type: array
              items:
                $ref: '#/components/schemas/ContactSummary'
        alertSettings:
          type: object
          required: [includeLocation, countdownSeconds, reviewed]
          properties:
            includeLocation:
              type: boolean
            countdownSeconds:
              type: integer
              minimum: 5
              maximum: 60
            reviewed:
              type: boolean
        activeCheckIn:
          $ref: '#/components/schemas/ActiveCheckIn'
        lastTest:
          $ref: '#/components/schemas/LastTest'
    ActiveCheckIn:
      type: object
      nullable: true
      required: [id, destination, dueAt, deadlineAt, status]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        destination:
          type: string
        dueAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [active]
    LastTest:
      type: object
      nullable: true
      required: [helpRequestId, at, outcome]
      properties:
        helpRequestId:
          $ref: '#/components/schemas/Uuid'
        at:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [ok, failed, pending]
    ReadinessItem:
      type: object
      required: [id, ok, weight, text, recommendation]
      properties:
        id:
          type: string
          enum:
            - network-confirmed
            - network-two-confirmed
            - message-reviewed
            - location-permission
            - recent-test
            - facade-usage
            - secret-code
        ok:
          type: boolean
        weight:
          type: integer
          minimum: 0
          maximum: 100
        text:
          type: string
        recommendation:
          type: string
          nullable: true
    ReadinessBlock:
      type: object
      required: [score, level, items, messagePreview]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        level:
          type: string
          enum: [ready, almost, attention]
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessItem'
        messagePreview:
          $ref: '#/components/schemas/ReadinessMessagePreview'
    ReadinessMessagePreview:
      type: object
      nullable: true
      description: '`null` na prontidão de reserva (`sources.readiness = "fallback"`)'
      required: [text, characters, limit]
      properties:
        text:
          type: string
        characters:
          type: integer
          minimum: 0
        limit:
          type: integer
          enum: [4096]
    DisabledFeature:
      type: object
      required: [id, title, reason]
      properties:
        id:
          type: string
          enum: [sms-whatsapp-email, web-push, check-in-push, decoy-code, false-alarm-message]
        title:
          type: string
        reason:
          type: string
    AggregatedData:
      type: object
      required: [generatedAt, facade, safety, readiness, disabledFeatures, sources]
      properties:
        generatedAt:
          type: string
          format: date-time
        facade:
          $ref: '#/components/schemas/FacadeBlock'
        safety:
          $ref: '#/components/schemas/SafetyBlock'
        readiness:
          $ref: '#/components/schemas/ReadinessBlock'
        disabledFeatures:
          type: array
          items:
            $ref: '#/components/schemas/DisabledFeature'
        sources:
          type: object
          required: [notes, safety, readiness]
          properties:
            notes:
              type: string
              enum: [ok, unavailable]
            safety:
              type: string
              enum: [ok, unavailable]
            readiness:
              type: string
              enum: [ok, fallback]

    # Rede de apoio
    ContactStatus:
      type: string
      enum: [pending, confirmed, declined]
    Contact:
      type: object
      required: [id, nickname, position, status, channel, inviteExpiresAt, respondedAt, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nickname:
          type: string
          minLength: 1
          maxLength: 40
        position:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ContactStatus'
        channel:
          type: string
          enum: [telegram, web, null]
          nullable: true
        inviteExpiresAt:
          type: string
          format: date-time
          nullable: true
        respondedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    ContactInput:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 40
    ContactList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Contact'
    ReorderContactsRequest:
      type: object
      required: [contactIds]
      properties:
        contactIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
    Invitation:
      type: object
      required: [contactId, token, inviteUrl, telegramUrl, expiresAt]
      properties:
        contactId:
          $ref: '#/components/schemas/Uuid'
        token:
          $ref: '#/components/schemas/OpaqueToken'
        inviteUrl:
          type: string
          format: uri
        telegramUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time

    # Mensagem
    MessageTemplate:
      type: string
      minLength: 1
      maxLength: 3800
    AlertSettings:
      type: object
      required:
        [messageTemplate, includeLocation, countdownSeconds, checkInToleranceMinutes, reviewed, reviewedAt]
      properties:
        messageTemplate:
          $ref: '#/components/schemas/MessageTemplate'
        includeLocation:
          type: boolean
        countdownSeconds:
          type: integer
          minimum: 5
          maximum: 60
        checkInToleranceMinutes:
          type: integer
          minimum: 0
          maximum: 60
        reviewed:
          type: boolean
        reviewedAt:
          type: string
          format: date-time
          nullable: true
    UpdateAlertSettingsRequest:
      type: object
      required: [messageTemplate, includeLocation, countdownSeconds, checkInToleranceMinutes]
      properties:
        messageTemplate:
          $ref: '#/components/schemas/MessageTemplate'
        includeLocation:
          type: boolean
        countdownSeconds:
          type: integer
          minimum: 5
          maximum: 60
        checkInToleranceMinutes:
          type: integer
          minimum: 0
          maximum: 60
    Location:
      type: object
      nullable: true
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          minimum: 0
          nullable: true
    MessagePreviewRequest:
      type: object
      properties:
        template:
          type: string
          minLength: 1
          maxLength: 4096
          description: Sem este campo, usa o modelo salvo
        contactNickname:
          type: string
          minLength: 1
          maxLength: 40
          description: Sem este campo, usa o primeiro contato confirmado
        location:
          $ref: '#/components/schemas/Location'
    MessagePreview:
      type: object
      required: [text, characters, limit, withinLimit, mapUrl]
      properties:
        text:
          type: string
        characters:
          type: integer
          minimum: 0
        limit:
          type: integer
          enum: [4096]
        withinLimit:
          type: boolean
        mapUrl:
          type: string
          format: uri
          nullable: true

    # Check-ins
    CheckInStatus:
      type: string
      enum: [active, confirmed, cancelled, expired]
    CheckIn:
      type: object
      required:
        - id
        - destination
        - dueAt
        - toleranceMinutes
        - deadlineAt
        - status
        - mode
        - version
        - createdAt
        - confirmedAt
        - expiredAt
        - helpRequestId
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        destination:
          type: string
          minLength: 1
          maxLength: 120
        dueAt:
          type: string
          format: date-time
        toleranceMinutes:
          type: integer
          minimum: 0
          maximum: 60
        deadlineAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/CheckInStatus'
        mode:
          $ref: '#/components/schemas/Mode'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        expiredAt:
          type: string
          format: date-time
          nullable: true
        helpRequestId:
          type: string
          format: uuid
          nullable: true
    StartCheckInRequest:
      type: object
      required: [destination, dueAt, mode]
      properties:
        destination:
          type: string
          minLength: 1
          maxLength: 120
        dueAt:
          type: string
          format: date-time
        toleranceMinutes:
          type: integer
          minimum: 0
          maximum: 60
        mode:
          $ref: '#/components/schemas/Mode'
    ExtendCheckInRequest:
      type: object
      required: [dueAt]
      properties:
        dueAt:
          type: string
          format: date-time
        toleranceMinutes:
          type: integer
          minimum: 0
          maximum: 60
    CheckInPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckIn'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    # Pedidos de ajuda
    TriggerHelpRequestRequest:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        location:
          $ref: '#/components/schemas/Location'
    DeliveryStep:
      type: object
      required: [id, stepOrder, contactId, contactNickname, channel, outcome, message, errorCode, occurredAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        stepOrder:
          type: integer
          minimum: 1
        contactId:
          type: string
          format: uuid
          nullable: true
        contactNickname:
          type: string
          nullable: true
        channel:
          type: string
          enum: [telegram, web, none]
        outcome:
          type: string
          enum: [sent, published_web, would_send, failed, skipped_unconfirmed, no_contacts]
        message:
          type: string
          nullable: true
        errorCode:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time
    HelpRequest:
      type: object
      required: [id, origin, mode, status, location, checkInId, createdAt, dispatchedAt, steps]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        origin:
          type: string
          enum: [button, check_in]
        mode:
          $ref: '#/components/schemas/Mode'
        status:
          type: string
          enum: [triggered, dispatched, cancelled, failed]
        location:
          $ref: '#/components/schemas/Location'
        checkInId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        dispatchedAt:
          type: string
          format: date-time
          nullable: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryStep'
    HelpRequestSummary:
      type: object
      required: [id, origin, mode, status, createdAt, dispatchedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        origin:
          type: string
          enum: [button, check_in]
        mode:
          $ref: '#/components/schemas/Mode'
        status:
          type: string
          enum: [triggered, dispatched, cancelled, failed]
        createdAt:
          type: string
          format: date-time
        dispatchedAt:
          type: string
          format: date-time
          nullable: true
    HelpRequestPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HelpRequestSummary'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    # Convite
    InvitationPage:
      type: object
      required: [inviterDisplayName, status, channel, expiresAt, respondable, telegramUrl, remoteUrl]
      properties:
        inviterDisplayName:
          $ref: '#/components/schemas/DisplayName'
        status:
          $ref: '#/components/schemas/ContactStatus'
        channel:
          type: string
          enum: [telegram, web, null]
          nullable: true
        expiresAt:
          type: string
          format: date-time
        respondable:
          type: boolean
        telegramUrl:
          type: string
          format: uri
        remoteUrl:
          type: string
          format: uri
          description: '`remoteEntry.js` do remote `safety`, para o shell carregar o `safety/Invite`'
    AcceptInvitationRequest:
      type: object
      required: [channel]
      properties:
        channel:
          type: string
          enum: [telegram, web]
    InvitationAlerts:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [helpRequestId, message, publishedAt]
            properties:
              helpRequestId:
                $ref: '#/components/schemas/Uuid'
              message:
                type: string
              publishedAt:
                type: string
                format: date-time

    ProblemDetails:
      type: object
      description: Erro no formato RFC 9457, com o `code` estável para o cliente decidir o que fazer
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - VERSION_CONFLICT
            - INVALID_STATE
            - EMAIL_IN_USE
            - INVITATION_EXPIRED
            - RATE_LIMITED
            - UPSTREAM_UNAVAILABLE
            - INTERNAL_ERROR
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
  responses:
    ValidationFailed:
      description: Corpo ou parâmetros inválidos
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            validation:
              value:
                type: /errors/validation-failed
                title: Dados inválidos
                status: 400
                code: VALIDATION_FAILED
                detail: O campo title tem mais de 200 caracteres.
                instance: /notes
                correlationId: 01a1b2e9-6290-7765-80a9-717fa4f6dfff
                errors:
                  - field: title
                    message: máximo de 200 caracteres
    LockCodeInvalid:
      description: Código fora do formato, ou senha atual errada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            wrongPassword:
              value:
                type: /errors/validation-failed
                title: Dados inválidos
                status: 400
                code: VALIDATION_FAILED
                instance: /account/lock-code
                correlationId: 01a1b2e9-6290-7765-80a9-717fa4f6dfff
                errors:
                  - field: currentPassword
                    message: senha incorreta
            badCode:
              value:
                type: /errors/validation-failed
                title: Dados inválidos
                status: 400
                code: VALIDATION_FAILED
                instance: /account/lock-code
                correlationId: 01a1b2e9-6290-7765-80a9-717fa4f6dfff
                errors:
                  - field: code
                    message: use de 6 a 8 dígitos
    Unauthenticated:
      description: JWT ausente, inválido ou vencido. O cliente renova a sessão e repete a chamada uma vez.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            unauthenticated:
              value:
                type: /errors/unauthenticated
                title: Não autenticado
                status: 401
                code: UNAUTHENTICATED
                correlationId: 01a1b2e9-6290-7765-80a9-717fa4f6dfff
    InvalidCredentials:
      description: E-mail ou senha errados (a resposta não diz qual)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            invalid:
              value:
                type: /errors/unauthenticated
                title: Não autenticado
                status: 401
                code: UNAUTHENTICATED
                detail: E-mail ou senha incorretos.
                instance: /auth/login
                correlationId: 01a1b2e9-6290-7765-80a9-717fa4f6dfff
    UnlockRefused:
      description: Código errado ou conta bloqueada. A resposta é sempre igual, sem detalhes.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            refused:
              value:
                type: /errors/forbidden
                title: Acesso negado
                status: 403
                code: FORBIDDEN
                correlationId: 01a1b2e9-6290-7765-80a9-717fa4f6dfff
    SafetySessionRequired:
      description: '`X-Safety-Token` ausente, vencido ou revogado. O cliente faz a saída rápida.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            forbidden:
              value:
                type: /errors/forbidden
                title: Acesso negado
                status: 403
                code: FORBIDDEN
                correlationId: 01a1b2e9-6290-7765-80a9-717fa4f6dfff
    NotFound:
      description: O recurso não existe ou não é da conta (a resposta não diz qual dos dois)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            notFound:
              value:
                type: /errors/not-found
                title: Não encontrado
                status: 404
                code: NOT_FOUND
                correlationId: 01a1b2e9-6290-7765-80a9-717fa4f6dfff
    VersionConflict:
      description: A nota mudou desde a versão enviada. O front recarrega a nota.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            conflict:
              value:
                type: /errors/version-conflict
                title: Versão desatualizada
                status: 409
                code: VERSION_CONFLICT
                detail: A nota foi alterada depois da versão 1. Versão atual 2.
                instance: /notes/6aec6fc05bd053a2e3d78b78
                correlationId: 01a1b2e9-6290-7765-80a9-717fa4f6dfff
    EmailInUse:
      description: Já existe uma conta com este e-mail
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            emailInUse:
              value:
                type: /errors/email-in-use
                title: E-mail já cadastrado
                status: 409
                code: EMAIL_IN_USE
                instance: /auth/register
                correlationId: 01a1b2e9-6290-7765-80a9-717fa4f6dfff
    TooManyContacts:
      description: A rede já tem 10 contatos
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            limit:
              value:
                type: /errors/invalid-state
                title: Operação não permitida agora
                status: 409
                code: INVALID_STATE
                detail: A rede de apoio já tem 10 contatos.
                instance: /safety/contacts
                correlationId: 01a1b2e9-6290-7765-80a9-717fa4f6dfff
    CheckInAlreadyActive:
      description: Já existe um check-in ativo neste modo
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            active:
              value:
                type: /errors/invalid-state
                title: Operação não permitida agora
                status: 409
                code: INVALID_STATE
                detail: Já existe um check-in ativo.
                instance: /safety/check-ins
                correlationId: 01a1b2e9-6290-7765-80a9-717fa4f6dfff
    CheckInNotActive:
      description: O check-in não está mais ativo
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            expired:
              value:
                type: /errors/invalid-state
                title: Operação não permitida agora
                status: 409
                code: INVALID_STATE
                detail: O check-in já venceu.
                correlationId: 01a1b2e9-6290-7765-80a9-717fa4f6dfff
    HelpRequestNotCancellable:
      description: O pedido já foi cancelado ou falhou
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            cancelled:
              value:
                type: /errors/invalid-state
                title: Operação não permitida agora
                status: 409
                code: INVALID_STATE
                detail: O pedido já foi cancelado.
                correlationId: 01a1b2e9-6290-7765-80a9-717fa4f6dfff
    InvitationAlreadyAnswered:
      description: O convite já foi respondido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            answered:
              value:
                type: /errors/invalid-state
                title: Operação não permitida agora
                status: 409
