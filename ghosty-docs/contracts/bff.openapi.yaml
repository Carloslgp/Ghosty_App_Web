        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Painel
  /aggregated-data:
    get:
      tags: [dashboard]
      operationId: getAggregatedData
      summary: Painel da área de segurança em um único JSON
      description: |
        Junta, em paralelo, o resumo das notas (`notes-service`), o resumo da segurança (`safety-service`)
        e a prontidão calculada pela Function. Cada chamada tem 3 segundos de limite.

        - Uma fonte fora do ar não derruba a resposta: o bloco dela vem `null` e `sources.<fonte>` vem
          `unavailable`. A resposta continua 200.
        - Se a Function falhar, o BFF calcula uma prontidão mínima e marca `sources.readiness = "fallback"`.
      security:
        - bearerAuth: []
          safetyToken: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - name: geo
          in: query
          description: Situação da permissão de localização no navegador (`navigator.permissions`)
          schema:
            type: string
            enum: [granted, denied, prompt, unknown]
            default: unknown
          example: granted
      responses:
        '200':
          description: Painel completo ou parcial
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregatedData'
              examples:
                complete:
                  $ref: '#/components/examples/AggregatedComplete'
                notesUnavailable:
                  $ref: '#/components/examples/AggregatedNotesUnavailable'
                readinessFallback:
                  $ref: '#/components/examples/AggregatedReadinessFallback'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/SafetySessionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

